defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0
    actor: "1-2"

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_grpo_openpi_pi05_bcfullshot_gs1500"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 500
  max_steps: 500

  only_eval: False
  val_check_interval: 5
  save_interval: 10
  # Save checkpoints/best when eval success_rate improves (requires val_check_interval > 0).
  save_best: True
  best_metric: "eval/success_rate"

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  reward_coef: 1.0
  rollout_epoch: 16 # doubled to keep total_num_envs * rollout_epoch = 128 after cutting envs 16→8
  eval_rollout_epoch: 10 # 5 envs × 10 epochs = 50 eval episodes; fewer parallel MuJoCo procs than 10×5

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo # NOTE: template used `grpo_rtg`, which is NOT registered in this codebase (only gae/grpo/reinpp exist in rlinf/algorithms/advantages.py); keep `grpo` to avoid a runtime KeyError
  loss_type: actor
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 8 # reduced for host-RAM OOM; must be multiple of actor world_size (2) and env.train.group_size (8)
    auto_reset: False
    ignore_terminations: False
    max_episode_steps: 480 # max episode steps for truncation
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    group_size: 8 # env-side parallelism grouping; decoupled from algorithm.group_size (used for GRPO advantage)
    seed: 42
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
  eval:
    # 5 parallel envs (lower host CPU/RAM than 10) × 10 epochs = 50 episodes.
    # is_eval uses ordered reset-state walk over the full LIBERO-10 (task,trial)
    # pool so all 10 tasks appear across the 50 episodes.
    total_num_envs: 5
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    seed: 42
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    # BC full-shot SFT checkpoint (global_step_1500), trained with the new
    # self-contained openpi_pytorch model_type (jax-aligned PyTorch Pi0.5),
    # converted to the new-format layout (model.safetensors + norm_stats) via
    # denserwd/config/vla/convert_sft2new_pi05_bc_fullshot_gs1500.py
    model_type: "openpi_pytorch"
    model_path: "/workspace/RLinf/models_ckpts/global_step_1500/actor/new_format_pytorch"
    precision: ${actor.model.precision}
    is_lora: False
    lora_rank: 32
    num_action_chunks: 10
    action_dim: 7
    use_proprio: True
    num_steps: 5
    add_value_head: True
    openpi:
      task: eval
      config_name: "pi05_libero"
      num_images_in_input: 2
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      noise_method: "flow_sde"
      noise_level: 0.5
      train_expert_only: True
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: null

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64 # must be divisible by micro_batch_size(4) * actor world_size(2) and algorithm.group_size(8); rollout volume is total_num_envs(8) * rollout_epoch(16) = 128
  seed: 42
  enable_offload: False

  # openpi_pytorch model config (jax-aligned self-contained PyTorch Pi0.5).
  # Model-shape comes entirely from these YAML fields; no checkpoint config.json
  # is read (see rlinf/models/embodiment/openpi_pytorch/__init__.py).
  model:
    model_type: "openpi_pytorch"
    # BC full-shot SFT checkpoint (global_step_1500), converted to the new-format
    # layout via denserwd/config/vla/convert_sft2new_pi05_bc_fullshot_gs1500.py
    model_path: "/workspace/RLinf/models_ckpts/global_step_1500/actor/new_format_pytorch"
    precision: null # for openpi_pytorch, precision is null (weights already bf16 from conversion); do not change
    is_lora: False
    lora_rank: 32
    num_action_chunks: 10
    action_dim: 7
    use_proprio: True
    num_steps: 5
    add_value_head: True
    openpi:
      task: rl
      config_name: "pi05_libero"
      num_images_in_input: 2
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      noise_method: "flow_sde"
      noise_level: 0.5
      train_expert_only: True
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: null

  optim:
    lr: 2.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    use_orig_params: True # required: openpi.train_expert_only=True freezes the SigLIP/expert-0 params, so an FSDP flat group would mix requires_grad values ("Must flatten tensors with uniform `requires_grad` when `use_orig_params=False`"). The old `Cannot writeback when parameter shape changes` issue was specific to the legacy HF-wrapped `openpi` model and does not apply to `openpi_pytorch`.
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    
reward:
  use_reward_model: False

critic:
  use_critic_model: False