# Fixed Object ID500 protocol for every checkpoint of the epoch18 GRPO-RTG run.
defaults:
  - env/libero_object@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env: 0-0
    rollout: 0-0

runner:
  task_type: embodied_eval
  logger:
    log_path: /mnt/storage2/users/hfwang_data/vla_project/reference_md_OPT/srm_minus_one/4b/grpo_rtg_epoch18_seed42_libero_3suite/id_eval_object_all_ckpts_fixed500_gpu5_20260813/data/runtime
    project_name: rlinf
    experiment_name: object_srm4b_m1_grpo_rtg_e18_fixed_id500
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  eval_rng_seed: 42
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 50
    total_num_envs: 10
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT
    model_type: openpi
    precision: null
    num_action_chunks: 10
    num_steps: 5
    openpi:
      noise_level: 0.5

reward:
  use_reward_model: false

critic:
  use_critic_model: false
