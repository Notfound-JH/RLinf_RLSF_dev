defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-4
    env: 0-4
    rollout: 0-4

runner:
  task_type: embodied_eval
  logger:
    log_path: data/results
    project_name: rlinf
    experiment_name: openpi05_libero_spatial_binary_gs50_fixed500
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  eval_rng_seed: 42
  resume_dir: null
  ckpt_path: /scratch/rlinf-checkpoints/openpi05_libero_spatial_binary_grpo_2xa100/checkpoints/global_step_50/actor/model_state_dict/full_weights.pt

algorithm:
  rollout_epoch: 1
  eval_rollout_epoch: 2
  gamma: 0.99
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false

env:
  group_name: EnvGroup
  train:
    total_num_envs: 100
  eval:
    rollout_epoch: 2
    total_num_envs: 250
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:RLINF_PI05_MODEL_PATH,/mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT}
    model_type: openpi
    precision: null
    num_action_chunks: 10
    num_steps: 5
    openpi:
      noise_level: 0.5

actor:
  group_name: ActorGroup
  model:
    model_path: ${oc.env:RLINF_PI05_MODEL_PATH,/mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT}
    precision: null
    num_action_chunks: 10
    num_steps: 5
    add_value_head: false
    openpi:
      noise_level: 0.5

reward:
  use_reward_model: false

critic:
  use_critic_model: false