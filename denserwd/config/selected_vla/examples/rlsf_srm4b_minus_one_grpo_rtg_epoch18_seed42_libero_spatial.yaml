# Derived from the frozen input configuration that produced the referenced
# LIBERO-10 global_step_50 policy. Intentional changes are limited to the
# suite, its official horizon, the three-GPU placement, and the run identity/output path.
# This is a fresh run from RLinf-Pi05-LIBERO-SFT; it does not load step 50.

defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: policy_runtime
      placement: 0-0
    env:
      node_group: policy_runtime
      placement: 2-2
    rollout:
      node_group: policy_runtime
      placement: 2-2
    reward:
      node_group: reward_runtime
      placement: 1-1
  node_groups:
    - label: policy_runtime
      node_ranks: 0-0
      env_configs:
        - node_ranks: 0-0
          python_interpreter_path: ${oc.env:RLSF_DRIVER_PYTHON}
    - label: reward_runtime
      node_ranks: 0-0
      env_configs:
        - node_ranks: 0-0
          python_interpreter_path: ${oc.env:RLSF_REWARD_PYTHON}

runner:
  task_type: embodied
  logger:
    log_path: /mnt/storage2/users/hfwang_data/vla_project/reference_md_OPT/srm_minus_one/4b/grpo_rtg_epoch18_seed42_libero_3suite/models/trained/libero_spatial
    project_name: rlinf
    experiment_name: rq2_rlsf_srm4b_m1_grpo_rtg_e18_s42_libero_spatial_ns5_ue2
    logger_backends: [tensorboard]
  max_epochs: 50
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo_rtg
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 8
    total_num_envs: 16
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    seed: 42
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  # The unified Pi0.5 LIBERO SFT checkpoint uses this normalization key for
  # Spatial, Object, Goal, and LIBERO-10.
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}
    num_steps: 5

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  # 16 envs * 8 rollout epochs * (240 / 10) = 3072 chunk samples.
  # At global_batch_size=64 and update_epoch=2 this is 96 Adam steps/update.
  global_batch_size: 64
  seed: 42
  enable_offload: false
  model:
    model_path: /mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT
    num_action_chunks: 10
    num_steps: 5
    precision: null
    is_lora: false
    openpi:
      train_expert_only: true
  optim:
    lr: 2.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    use_orig_params: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: true
  group_name: RewardGroup
  reward_mode: history_buffer
  reward_output_transform: probability_minus_one
  reward_delta_clip: null
  terminal_success_anchor: true
  history_reward_assign: false
  reward_weight: 1.0
  env_reward_weight: 0.0
  model:
    model_type: srm_qwenvl
    checkpoint_path: /mnt/storage2/users/hfwang_data/vla_project/outputs/SRM_training/models/qwenvl4b_libero_v5_octoalign_srpo_aligned_raw01_noleak/checkpoint_epoch_18.pth
    legacy_repo_path: /mnt/storage2/users/hfwang_data/vla_project/RLinf-RLSF
    model_path: /mnt/storage/models/Qwen3-VL-4B-Instruct
    precision: bf16
    device_map: current_device
    infer_micro_batch_size: 1
    interval_reward: 0.0
    reward_reduce: mean
    history_source: raw_action_frames
    context_window: 4
    history_buffer_name: srm_context
    history_buffers:
      srm_context:
        history_size: 4
        min_history_size: 1
        input_interval: 1
        input_on_done: true
        history_keys:
          - main_images
          - wrist_images
          - states
          - task_descriptions

critic:
  use_critic_model: false
