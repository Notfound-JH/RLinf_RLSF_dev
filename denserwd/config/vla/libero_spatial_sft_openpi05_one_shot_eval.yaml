defaults:
  - model/pi0_5@actor.model
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 7

runner:
  task_type: sft
  logger:
    log_path: "data/results/openpi05_libero_spatial_sft_one_shot_eval"  # the path to save results
    project_name: rlinf
    experiment_name: "openpi05_libero_sft_one_shot_spatial"  # the name of this experiment, which will be used as a subfolder under log_path to save results
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 10000
  max_steps: -1
  val_check_interval: -1
  save_interval: 2000

  only_eval: True
  ckpt_path: null  # path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).


data:
  data_path: "/workspace/public_dataset/"
  episode_index_path: "/workspace/public_dataset/physical-intelligence/libero/one_shot.csv"

algorithm:
  adv_type: gae
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  loss_type: actor_critic
  loss_agg_func: "token-mean" 

  sampling_params:
    do_sample: False  # False for SFT, True for RL (https://rlinf.readthedocs.io/zh-cn/latest/rst_source/examples/embodied/libero.html#id7)
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 5

  eval:
    # Libero 每个 task suite 都有 10 个任务，并提供 50 个 initial state 供测试，所以理论上总共有 500 个测试样例
    # 在进行测试时，我们应该覆盖这个 500 个测试样例，通常是通过设置 total_num_envs=500 完成
    # 但这么做可能会出现 OOD 的问题，所以在这里我们设置 total_num_envs=50，来覆盖 50 个 initial state，来进行测试
    # 同时设置 max_steps_per_rollout_epoch 为 max_episode_steps 的 10 倍，达到类似 total_num_envs=500 的效果
    # 具体原理可以参考 RLinf 的文档 https://rlinf.readthedocs.io/zh-cn/latest/rst_source/start/vla-eval.html#id2
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    max_episode_steps: 250 # max episode steps for truncation, can be different for different task suites.
    max_steps_per_rollout_epoch: 2500
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/openpi_libero_sft_one_shot_10/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/workspace/pretrained_vlas/openpi/torch/pi05_libero_few_shot"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 16
  seed: 42

  # Override the default values in model/pi0
  model:
    precision: null
    model_path: "/workspace/pretrained_vlas/openpi/torch/pi05_libero_few_shot"
    num_action_chunks: 5 # interface for the env
    add_value_head: True
    openpi:
      config_name: "pi05_libero"
      detach_critic_input: True
      value_after_vlm: True

  optim:
    lr: 2.5e-5  
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08  
    weight_decay: 1.0e-10  
    clip_grad: 1.0
    warmup_style: "cosine"  
    lr_warmup_steps: 1000  
    total_training_steps: 10000  # for lr scheduler cosine decay

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False