# Full LIBERO-10 eval (10 tasks × 50 init states = 500 episodes)
# for GRPO openpi_pytorch checkpoint at global_step_50.
defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Visible devices 0,1 → rollout on GPU0, env on GPU1
    rollout: 0
    env: 1
    actor: 0

runner:
  task_type: embodied
  logger:
    log_path: "/workspace/RLinf/results"
    project_name: rlinf
    experiment_name: "libero_10_grpo_openpi_pi05_gs50_eval500"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1

  only_eval: True
  # Consolidated RL weights (policy + value_head) from global_step_50.
  ckpt_path: "/workspace/RLinf/results/libero_10_grpo_openpi_pi05_bcfullshot_gs1500/checkpoints/global_step_50/actor/model_state_dict/full_weights.pt"

algorithm:
  adv_type: grpo
  # one epoch covers all 500 episodes via max_steps_per_rollout_epoch below
  eval_rollout_epoch: 1
  group_size: 8
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  loss_type: actor
  loss_agg_func: "token-mean"

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 1

  eval:
    # 10 envs × 50 episodes/env × 480 steps = 24000 → full 500 episodes.
    # Host currently has more free RAM; keep Ray memory killer disabled in the script.
    total_num_envs: 10
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 24000
    seed: 42
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: "openpi_pytorch"
    model_path: "/workspace/RLinf/models_ckpts/global_step_1500/actor/new_format_pytorch"
    precision: ${actor.model.precision}
    is_lora: False
    lora_rank: 32
    num_action_chunks: 10
    action_dim: 7
    use_proprio: True
    num_steps: 5
    add_value_head: True
    openpi:
      # Rollout worker deep-copies actor.model; keep rl so value_head keys match ckpt.
      task: rl
      config_name: "pi05_libero"
      num_images_in_input: 2
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      noise_method: "flow_sde"
      noise_level: 0.5
      train_expert_only: True
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: null

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 42
  enable_offload: False

  model:
    model_type: "openpi_pytorch"
    model_path: "/workspace/RLinf/models_ckpts/global_step_1500/actor/new_format_pytorch"
    precision: null
    is_lora: False
    lora_rank: 32
    num_action_chunks: 10
    action_dim: 7
    use_proprio: True
    num_steps: 5
    add_value_head: True
    openpi:
      task: rl
      config_name: "pi05_libero"
      num_images_in_input: 2
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      noise_method: "flow_sde"
      noise_level: 0.5
      train_expert_only: True
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      detach_critic_input: null

  optim:
    lr: 2.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
