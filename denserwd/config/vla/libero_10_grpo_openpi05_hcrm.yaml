defaults:
  - env/libero_10_hcrm@env.train
  - env/libero_10_hcrm@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 1
    actor: "0"

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_grpo_openpi_hcrm"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 50
  max_steps: -1

  only_eval: False
  val_check_interval: 15
  save_interval: 30
  print_episode_rewards: True

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 8
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 6
    reward_coef: 1.0
    group_size: 1
    max_episode_steps: 480 # max episode steps for truncation
    max_steps_per_rollout_epoch: 480
  eval:
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: True
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT"
    precision: ${actor.model.precision}
    # num_action_chunks: 5

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 48 # = total_num_envs(6) * rollout_epoch(8); must be divisible by micro_batch_size(4) * actor world_size(1)
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0
  model:
    model_path: "/mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT"
    num_action_chunks: 5
    precision: "bf16"
    add_value_head: False
    is_lora: True
    # rollout deep-copies actor.model (see MultiStepRolloutWorker.init_worker),
    # so this also controls the SDE exploration noise used at rollout time.
    # Tried 0.7 (up from the pi0_5 default 0.5) to counter policy collapse,
    # but it made things worse: extra execution noise directly hurt raw
    # task-completion probability, so success_rate collapsed even faster
    # (by step ~7 instead of ~27). Reverted to the default.
    openpi:
      noise_level: 0.5 # flow_sde 的默认噪声强度
      noise_logvar_range: [0.08, 0.16] # flow_noise 的默认可学习噪声范围
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde" # flow_sde, flow_noise
      add_value_head: False
      pi05: False
      value_after_vlm: False
      joint_logprob: False 

  optim:
    lr: 3.0e-7
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"   # OpenPI embodied 权重同步需 no_shard；full_shard 会导致 flat state_dict
    use_orig_params: False
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision} 
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
