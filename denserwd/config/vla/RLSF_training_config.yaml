# Policy-training configuration for the two direct-SRM RLSF rows in Table 5.
metadata:
  table: table5.csv
  rows:
    - "RLSF (SRM-2B)"
    - "RLSF (SRM-4B)"
  config_scope: RLSF policy training with a frozen SRM reward model
  rlinf_commit: 99b32c957f88ee681a2e64beed00ebd2284e3c26
  source_config: /mnt/storage2/users/hfwang_data/vla_project/outputs_RQ2/RLSF_Results/configs/rq2_direct_libero10_grpo_rlsf.yaml
  source_launcher: /mnt/storage2/users/hfwang_data/vla_project/outputs_RQ2/RLSF_Results/scripts/run_train_inner.sh
  current_artifact_directory: /mnt/storage2/users/hfwang_data/vla_project/outputs_RQ2/RLSF_Results
  runtime_root_recorded_by_the_run: /mnt/storage2/users/hfwang_data/vla_project/outputs_RQ2/direct_srm_reward_99b32c95

shared:
  initial_policy: /mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT
  task_type: embodied
  environment_suite: libero_10

  runner:
    max_epochs: 1000
    max_steps: 20
    only_eval: false
    val_check_interval: -1
    save_interval: 5
    resume_dir: null
    ckpt_path: null

  algorithm:
    adv_type: grpo
    normalize_advantages: true
    group_size: 8
    update_epoch: 4
    reward_coef: 1.0
    reward_type: chunk_level
    logprob_type: chunk_level
    entropy_type: token_level
    loss_type: actor
    loss_agg_func: token-mean
    kl_penalty: kl
    kl_beta: 0.0
    entropy_bonus: 0.0
    clip_ratio_high: 0.2
    clip_ratio_low: 0.2
    clip_ratio_c: 3.0
    value_clip: 0.2
    huber_delta: 10.0
    gamma: 0.99
    gae_lambda: 0.95
    filter_rewards: false
    rewards_lower_bound: 0.1
    rewards_upper_bound: 0.9

  actor:
    training_backend: fsdp
    micro_batch_size: 32
    global_batch_size: 1536
    model_num_steps: 4
    enable_offload: false
    optimizer:
      lr: 3.0e-7
      value_lr: 1.0e-4
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_eps: 1.0e-8
      clip_grad: 1.0
      weight_decay: 0.01
    fsdp:
      strategy: fsdp
      sharding_strategy: no_shard
      gradient_checkpointing: false

  rollout:
    generation_backend: huggingface
    recompute_logprobs: false
    unnorm_key: libero_10
    enable_offload: false
    pipeline_stage_num: 1

  environment:
    train:
      rollout_epoch: 8
      total_num_envs: 16
      max_episode_steps: 480
      max_steps_per_rollout_epoch: 480
      group_size: 8
      video_save: false
    trajectories_per_update: 128
    total_training_trajectories: 2560

  reward:
    use_reward_model: true
    model_type: srm_qwenvl
    reward_mode: history_buffer
    reward_output_transform: identity
    history_reward_assign: false
    reward_weight: 1.0
    env_reward_weight: 0.0
    precision: bf16
    device_map: current_device
    infer_micro_batch_size: 1
    interval_reward: 0.0
    reward_reduce: mean
    history_buffer_name: srm_context
    history_buffer:
      history_size: 4
      min_history_size: 1
      input_interval: 1
      input_on_done: true
      history_keys:
        - main_images
        - wrist_images
        - states
        - task_descriptions

  critic:
    use_critic_model: false

  cluster:
    num_nodes: 1
    topology: two_gpu_shared
    component_placement:
      actor: "0-0"
      env: "0-0"
      rollout: "1-1"
      reward: "1-1"

variants:
  rlsf_srm_2b:
    srm_pretrained_path: /mnt/storage/public_data/models/Qwen3-VL-2B-Instruct
    srm_checkpoint: /mnt/storage2/users/hfwang_data/vla_project/outputs/SRM_training/models/qwenvl2b_libero_v5_octoalign_srpo_aligned_raw01_noleak/best_model.pth
    table5_result_provenance:
      seed: 42
      final_global_step: 20
      actor_micro_batch_size_executed: 32
      oom_downgrade_triggered: false
      log: /mnt/storage2/users/hfwang_data/vla_project/outputs_RQ2/RLSF_Results/logs/rq2_direct_rlsf_2b_seed42_step20_99b32c95.log

  rlsf_srm_4b:
    srm_pretrained_path: /mnt/storage/models/Qwen3-VL-4B-Instruct
    srm_checkpoint: /mnt/storage2/users/hfwang_data/vla_project/outputs/SRM_training/models/qwenvl4b_libero_v5_octoalign_srpo_aligned_raw01_noleak/best_model.pth
    table5_result_provenance:
      seed: 42
      final_global_step: 20
      actor_micro_batch_size_executed: 32
      oom_downgrade_triggered: false
      log: /mnt/storage2/users/hfwang_data/vla_project/outputs_RQ2/RLSF_Results/logs/rq2_direct_rlsf_4b_seed42_step20_99b32c95.log

seed_protocol:
  originally_planned_seeds:
    - 42
    - 43
    - 44
  current_table5_values_are_three_seed_means: false
  current_table5_value_seed: 42
