defaults:
  - model/pi0@actor.model
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0  # all on single GPU (index within visible devices)

runner:
  task_type: embodied
  logger:
    log_path: "/workspace/RLinf/results"
    project_name: rlinf
    experiment_name: "pi0_libero_baseline_libero10_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 10000
  max_steps: -1
  val_check_interval: -1
  save_interval: 2000
  only_eval: True
  ckpt_path: null

algorithm:
  adv_type: grpo
  eval_rollout_epoch: 1
  group_size: 8
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  loss_type: actor
  loss_agg_func: "token-mean"

  # do_sample=False for deterministic baseline evaluation
  sampling_params:
    do_sample: False
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 5

  eval:
    # libero-10 has 10 tasks × 50 initial states = 500 test cases
    # Use 50 envs + max_steps_per_rollout_epoch=4800 (=10×480) to cycle through all 10 tasks
    # See: https://rlinf.readthedocs.io/zh-cn/latest/rst_source/start/vla-eval.html#id2
    total_num_envs: 10
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 24000  # 10 envs × 50 episodes × 480 steps = 500 total episodes
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT"
    precision: ${actor.model.precision}
    num_action_chunks: 5

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 4
  seed: 42

  model:
    precision: "bf16"
    model_path: "/mnt/storage/public_data/models/RLinf-Pi05-LIBERO-SFT"
    num_action_chunks: 5
    add_value_head: False
    openpi:
      config_name: "pi05_libero"
      detach_critic_input: False

  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 2.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
