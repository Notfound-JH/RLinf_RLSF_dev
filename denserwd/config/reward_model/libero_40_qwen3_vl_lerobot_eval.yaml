# @package _global_

defaults:
  - data: default
  - model: qwen3_vl
  - train: default
  - test: default
  - _self_

seed: 10000
use_wandb: false
device: "cuda"
benchmark_name: "LIBERO_40"

model:
  context_window: 4

train:
  batch_size: 2
  num_workers: 0
  enable_td_filter: false
  curriculum_first: false

test:
  checkpoint_path: null
  batch_size: 2
  add_reverse: true
  sample_step: 5
  openpi:
    config_name: "pi0_libero"
    model_path: "/workspace/pretrained_vlas/openpi/torch/pi0_base"
  data:
    data_path: "/workspace/public_dataset/"
    episode_index_path: "/workspace/public_dataset/physical-intelligence/libero/ten_shot.csv"

data:
  train_dataset_ratio: 1.0
  eval_dataset_ratio: 1.0
  test_dataset_ratio: 0.1
  sample_step: 15
